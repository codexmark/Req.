<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards - Req. Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="global-nav">
      <div class="global-nav__brand">
        <span class="brand-mark small">F</span>
        <div>
          <span class="global-nav__title">Req. Codex - Framework de Análise e Registro de Objetivos</span>
          <span class="global-nav__subtitle">Sistema de elicitação e consolidação de requisitos para sessões com rastreabilidade, validação e artefatos formais.</span>
        </div>
      </div>
      <nav class="global-nav__links" aria-label="Navegação principal">
        <a href="./index.html">Workspace</a>
        <a href="./cards.html">Cards</a>
        <a href="#requirements">Requisitos</a>
        <a href="#artifacts">Artefatos</a>
      </nav>
    </header>

    <div class="app-shell">
      <aside class="sidebar">
        <span id="autosave-indicator" class="autosave-badge">Auto-save</span>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Cards</p>
            <h2>Criador de Cards</h2>
          </div>
        </header>

        <section class="surface-card card-creator-card">
          <div class="section-title-row">
            <div>
              <p class="eyebrow">Cards</p>
              <h2>Criador de Cards</h2>
            </div>
          </div>

          <form id="card-form" class="form-grid form-grid-wide">
            <label class="full-span">
              Contexto
              <textarea
                name="contexto"
                rows="4"
                placeholder="Descreva o contexto do problema ou necessidade. Ex.: Referente à implementação do card #2615. Na tela de Programação de Férias..."
              ></textarea>
            </label>
            <label class="full-span">
              Comportamento Atual
              <textarea
                name="comportamentoAtual"
                rows="4"
                placeholder="Descreva como o sistema se comporta atualmente. Ex.: O modal lista apenas os períodos já cadastrados, ignorando períodos retroativos..."
              ></textarea>
            </label>
            <label class="full-span">
              Comportamento Esperado
              <textarea
                name="comportamentoEsperado"
                rows="4"
                placeholder="Descreva o comportamento desejado após a implementação. Ex.: O modal deve listar apenas os períodos ainda não cadastrados..."
              ></textarea>
            </label>
            <label class="full-span">
              Regras de Negócio
              <textarea
                name="regrasNegocio"
                rows="4"
                placeholder="Liste as regras de negócio aplicáveis. Ex.: Os períodos retroativos devem ser calculados com base na data de admissão..."
              ></textarea>
            </label>
            <label class="full-span">
              Critérios de Aceite
              <div id="acceptance-criteria-list" class="acceptance-criteria-list">
                <!-- Items will be added here -->
              </div>
              <div class="add-criteria-row">
                <input
                  id="new-criterion"
                  type="text"
                  placeholder="Adicione um critério de aceite. Ex.: O modal exibe apenas os períodos ainda não cadastrados..."
                  maxlength="200"
                />
                <button id="add-criterion" type="button" class="button secondary">Adicionar</button>
              </div>
            </label>
            <label class="full-span">
              Observação (opcional, máx. 250 caracteres)
              <textarea
                name="observacao"
                rows="2"
                maxlength="250"
                placeholder="Observações adicionais sobre o card."
              ></textarea>
            </label>
            <div class="action-row full-span">
              <button id="create-card" class="button primary">Criar Card</button>
              <button id="clear-card-form" class="button secondary">Limpar</button>
            </div>
          </form>

          <div id="created-cards" class="created-cards-list">
            <!-- Created cards will be displayed here -->
          </div>
        </section>
      </main>
    </div>

    <script src="./cards.js"></script>
  </body>
</html>
